<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="30" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="bold" fill="#0f172a">FIG 2: BENCH PROTOTYPING ON SOLDERLESS BREADBOARD</text>
  <text x="30" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">SOIC-8 adapter plugged into breadboard with long leaded capacitors &amp; tie-point parasitic paths</text>

  <!-- Breadboard Body -->
  <rect x="40" y="70" width="520" height="225" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="170" width="520" height="15" fill="#e2e8f0"/>

  <!-- Breadboard Tie-Point Grid Pattern -->
  <g fill="#94a3b8">
    <circle cx="80" cy="95" r="3"/><circle cx="110" cy="95" r="3"/><circle cx="140" cy="95" r="3"/><circle cx="170" cy="95" r="3"/>
    <circle cx="80" cy="115" r="3"/><circle cx="110" cy="115" r="3"/><circle cx="140" cy="115" r="3"/><circle cx="170" cy="115" r="3"/>
    <circle cx="80" cy="135" r="3"/><circle cx="110" cy="135" r="3"/><circle cx="140" cy="135" r="3"/><circle cx="170" cy="135" r="3"/>
    <circle cx="80" cy="155" r="3"/><circle cx="110" cy="155" r="3"/><circle cx="140" cy="155" r="3"/><circle cx="170" cy="155" r="3"/>

    <circle cx="430" cy="95" r="3"/><circle cx="460" cy="95" r="3"/><circle cx="490" cy="95" r="3"/><circle cx="520" cy="95" r="3"/>
    <circle cx="430" cy="115" r="3"/><circle cx="460" cy="115" r="3"/><circle cx="490" cy="115" r="3"/><circle cx="520" cy="115" r="3"/>
    <circle cx="430" cy="135" r="3"/><circle cx="460" cy="135" r="3"/><circle cx="490" cy="135" r="3"/><circle cx="520" cy="135" r="3"/>
    <circle cx="430" cy="155" r="3"/><circle cx="460" cy="155" r="3"/><circle cx="490" cy="155" r="3"/><circle cx="520" cy="155" r="3"/>

    <circle cx="80" cy="205" r="3"/><circle cx="110" cy="205" r="3"/><circle cx="140" cy="205" r="3"/><circle cx="170" cy="205" r="3"/>
    <circle cx="80" cy="225" r="3"/><circle cx="110" cy="225" r="3"/><circle cx="140" cy="225" r="3"/><circle cx="170" cy="225" r="3"/>
    <circle cx="80" cy="245" r="3"/><circle cx="110" cy="245" r="3"/><circle cx="140" cy="245" r="3"/><circle cx="170" cy="245" r="3"/>
    <circle cx="80" cy="265" r="3"/><circle cx="110" cy="265" r="3"/><circle cx="140" cy="265" r="3"/><circle cx="170" cy="265" r="3"/>

    <circle cx="430" cy="205" r="3"/><circle cx="460" cy="205" r="3"/><circle cx="490" cy="205" r="3"/><circle cx="520" cy="205" r="3"/>
    <circle cx="430" cy="225" r="3"/><circle cx="460" cy="225" r="3"/><circle cx="490" cy="225" r="3"/><circle cx="520" cy="225" r="3"/>
    <circle cx="430" cy="245" r="3"/><circle cx="460" cy="245" r="3"/><circle cx="490" cy="245" r="3"/><circle cx="520" cy="245" r="3"/>
    <circle cx="430" cy="265" r="3"/><circle cx="460" cy="265" r="3"/><circle cx="490" cy="265" r="3"/><circle cx="520" cy="265" r="3"/>
  </g>

  <!-- SOIC-8 Adapter Board (Green PCB) across divider -->
  <rect x="220" y="125" width="160" height="105" rx="3" fill="#15803d" stroke="#166534" stroke-width="2"/>
  <rect x="250" y="145" width="100" height="65" rx="2" fill="#0f172a"/>
  <text x="300" y="182" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">REF5045</text>
  <circle cx="260" cy="155" r="3" fill="#64748b"/>

  <!-- Adapter header pins -->
  <rect x="205" y="140" width="15" height="75" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="380" y="140" width="15" height="75" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>

  <!-- Leaded Capacitor plugged into breadboard for Pin 5 -->
  <path d="M 395 190 Q 430 190 440 220" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="440" cy="220" r="5" fill="#f59e0b"/>
  <!-- Disc capacitor -->
  <circle cx="475" cy="235" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="475" y="240" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">105</text>
  <line x1="440" y1="220" x2="460" y2="230" stroke="#64748b" stroke-width="1.5"/>
  <line x1="490" y1="240" x2="510" y2="250" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="510" cy="250" r="4" fill="#64748b"/>

  <!-- Callout Red Annotations -->
  <rect x="360" y="78" width="190" height="42" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="368" y="94" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">⚠️ Breadboard Leakage Current</text>
  <text x="368" y="110" font-family="-apple-system, sans-serif" font-size="9" fill="#991b1b">Surface R &lt; 100MΩ shunts Pin 5 Trim/NR</text>

  <rect x="60" y="195" width="145" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="68" y="211" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#b45309">⚠️ Parasitic Inductance</text>
  <text x="68" y="227" font-family="-apple-system, sans-serif" font-size="9" fill="#78350f">Long leads degrade C10 ESR</text>
</svg>
