<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="30" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="bold" fill="#0f172a">FIG 5: THE VERIFIED BENCH FIX &amp; PROTOTYPING DESIGN RULES</text>
  <text x="30" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">C11 DNP on breadboard eliminates leakage; C10 low-ESR restores phase margin</text>

  <!-- IC Symbol Box -->
  <rect x="180" y="80" width="180" height="180" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="270" y="115" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">REF5045</text>
  <text x="270" y="135" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">4.5000V Reference</text>

  <!-- Pin 2: VIN -->
  <line x1="100" y1="120" x2="180" y2="120" stroke="#0f172a" stroke-width="2"/>
  <text x="188" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a">2 VIN</text>
  <text x="90" y="115" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#2563eb">+5.2V</text>

  <!-- Pin 4: GND -->
  <line x1="270" y1="260" x2="270" y2="285" stroke="#0f172a" stroke-width="2"/>
  <text x="270" y="250" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a" text-anchor="middle">4 GND</text>
  <line x1="262" y1="285" x2="278" y2="285" stroke="#0f172a" stroke-width="2"/>

  <!-- Pin 6: VOUT -->
  <line x1="360" y1="120" x2="470" y2="120" stroke="#0f172a" stroke-width="2"/>
  <text x="320" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a">6 VOUT</text>
  <text x="480" y="124" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#059669">+4.5000V (STABLE)</text>

  <!-- C10 Box with Green Dash -->
  <rect x="385" y="140" width="115" height="95" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-dasharray="4 4" stroke-width="2"/>
  <line x1="410" y1="120" x2="410" y2="160" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="400" y1="160" x2="420" y2="160" stroke="#0f172a" stroke-width="2"/>
  <line x1="400" y1="165" x2="420" y2="165" stroke="#0f172a" stroke-width="2"/>
  <line x1="410" y1="165" x2="410" y2="195" stroke="#0f172a" stroke-width="1.5"/>
  <text x="430" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#166534">C10 (10µF)</text>
  <text x="430" y="180" font-family="-apple-system, sans-serif" font-size="9" fill="#15803d">X7R Ceramic</text>
  <text x="430" y="195" font-family="-apple-system, sans-serif" font-size="9" fill="#15803d">ESR ≤ 1.5Ω</text>
  <line x1="402" y1="195" x2="418" y2="195" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Pin 5: TRIM/NR Marked DNP -->
  <line x1="360" y1="210" x2="460" y2="210" stroke="#0f172a" stroke-width="2"/>
  <text x="295" y="214" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a">5 TRIM/NR</text>
  
  <rect x="465" y="185" width="115" height="60" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="2"/>
  <line x1="480" y1="200" x2="505" y2="225" stroke="#dc2626" stroke-width="3"/>
  <line x1="505" y1="200" x2="480" y2="225" stroke="#dc2626" stroke-width="3"/>
  <text x="515" y="212" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#dc2626">DNP</text>
  <text x="515" y="228" font-family="-apple-system, sans-serif" font-size="9" fill="#991b1b">Do Not Populate</text>
  <text x="515" y="238" font-family="-apple-system, sans-serif" font-size="9" fill="#991b1b">on Breadboard!</text>
</svg>
