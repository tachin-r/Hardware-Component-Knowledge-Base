<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <!-- PCB Outline (Blue FR4) -->
  <rect x="35" y="30" width="250" height="140" rx="8" fill="#1e40af" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Mounting Holes -->
  <circle cx="50" cy="45" r="5" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="270" cy="45" r="5" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="50" cy="155" r="5" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="270" cy="155" r="5" fill="#f1f5f9" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Terminal pads -->
  <rect x="38" y="70" width="16" height="24" rx="2" fill="#f59e0b"/>
  <text x="46" y="86" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">IN+</text>
  <rect x="38" y="106" width="16" height="24" rx="2" fill="#f59e0b"/>
  <text x="46" y="122" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">IN-</text>
  <rect x="266" y="70" width="16" height="24" rx="2" fill="#f59e0b"/>
  <text x="274" y="86" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">OUT+</text>
  <rect x="266" y="106" width="16" height="24" rx="2" fill="#f59e0b"/>
  <text x="274" y="122" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">OUT-</text>
  <!-- LM2596 IC (TO-263) -->
  <rect x="135" y="75" width="50" height="50" rx="3" fill="#0f172a" stroke="#334155"/>
  <text x="160" y="104" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">LM2596</text>
  <!-- Inductor 47uH -->
  <rect x="80" y="75" width="45" height="45" rx="5" fill="#334155" stroke="#475569"/>
  <text x="102" y="102" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">470</text>
  <!-- Blue Trimpot -->
  <rect x="195" y="75" width="28" height="40" rx="2" fill="#0284c7" stroke="#0369a1"/>
  <circle cx="209" cy="85" r="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <!-- Output Cap -->
  <circle cx="240" cy="100" r="14" fill="#64748b" stroke="#475569"/>
  <!-- Text Label -->
  <text x="160" y="55" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff" text-anchor="middle">HW-411 DC-DC BUCK MODULE</text>
  <!-- Callout note -->
  <text x="160" y="185" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">⚠️ Beware: High-Frequency Switching Noise on Breadboard</text>
</svg>
