<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <!-- TO-39 Outer Ring / Metal Can Header -->
  <circle cx="160" cy="95" r="65" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <!-- Inner Flange -->
  <circle cx="160" cy="95" r="54" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <!-- Glass Window Base -->
  <circle cx="160" cy="95" r="46" fill="#e2e8f0" stroke="#cbd5e1"/>
  <!-- Silicon Photodiode Chip / Active Area -->
  <rect x="142" y="77" width="36" height="36" rx="2" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
  <rect x="146" y="81" width="28" height="28" fill="#312e81"/>
  <!-- Glass Reflection Glare -->
  <path d="M 125 75 Q 160 55 195 75 A 46 46 0 0 0 125 75 Z" fill="rgba(255,255,255,0.45)"/>
  <!-- Tab / Notch on TO-39 Header -->
  <path d="M 92 90 L 98 92 L 98 98 L 92 100 Z" fill="#64748b"/>
  <!-- Text Label -->
  <text x="160" y="24" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">BPX 61</text>
  <text x="160" y="175" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">TO-39 Metal Can • 7.02 mm² Active Area Solar Sensor</text>
  <text x="160" y="190" font-family="-apple-system, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Operate in Photovoltaic Mode (0V Bias) for Zero Dark Current</text>
</svg>
