<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <!-- IC Body (SOIC-8) -->
  <rect x="90" y="40" width="140" height="120" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Pin 1 Dot -->
  <circle cx="110" cy="60" r="5" fill="#64748b"/>
  <!-- Top notch -->
  <path d="M 150 40 A 10 10 0 0 1 170 40" fill="#0f172a"/>
  <!-- Pins Left -->
  <rect x="62" y="52" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="62" y="78" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="62" y="104" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="62" y="130" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <!-- Pins Right -->
  <rect x="230" y="52" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="230" y="78" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="230" y="104" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="230" y="130" width="28" height="12" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <!-- Text Label on IC -->
  <text x="160" y="98" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">REF5045</text>
  <text x="160" y="118" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">4.500V PRECISION</text>
  <!-- Pin 6 VOUT highlight -->
  <rect x="230" y="104" width="28" height="12" rx="2" fill="#38bdf8" stroke="#0284c7"/>
  <!-- Pin 5 TRIM/NR highlight -->
  <rect x="230" y="130" width="28" height="12" rx="2" fill="#fbbf24" stroke="#d97706"/>
  <!-- Callout note -->
  <text x="160" y="182" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">SOIC-8 • Pin 6: 4.5V | Pin 5: Trim/NR</text>
</svg>
